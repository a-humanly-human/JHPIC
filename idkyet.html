<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JHPIC · James' Huge Problems Informatics Contest</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
    --purple: #a371f7; --orange: #ffa657;
  }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ---------- LOGIN SCREEN ---------- */
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; background: radial-gradient(circle at 50% 0%, #1c2128 0%, #0d1117 60%);
  }
  .login-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 1.5rem;
    padding: 2rem 2.2rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px -20px rgba(0,0,0,0.8);
  }
  .login-card h1 { margin: 0 0 0.3rem; font-size: 1.5rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.5rem; }
  .login-card h1 span { background: var(--accent); color: #0d1117; font-size: 0.6rem; padding: 0.15rem 0.5rem; border-radius: 100px; font-weight: 700; letter-spacing: 0.03em; }
  .login-card p.sub { margin: 0 0 1.5rem; color: var(--muted); font-size: 0.85rem; }
  .login-card label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .login-card input[type=text], .login-card input[type=password] {
    width: 100%; padding: 0.7rem 0.9rem; background: #0a0e14; color: var(--text);
    border: 1px solid var(--border); border-radius: 0.6rem; font-family: inherit; font-size: 0.9rem;
    margin-bottom: 1rem;
  }
  .login-card input:focus { outline: none; border-color: var(--accent); }
  .login-card button {
    width: 100%; padding: 0.75rem 1rem; background: var(--accent); color: #0d1117;
    border: none; border-radius: 0.6rem; font-family: inherit; font-size: 0.92rem; font-weight: 700;
    cursor: pointer; transition: 0.15s;
  }
  .login-card button:hover { background: #79b8ff; }
  .login-card .err { color: var(--red); font-size: 0.82rem; margin-bottom: 0.8rem; min-height: 1.2em; }
  .login-card .switch { text-align: center; margin-top: 1rem; font-size: 0.82rem; color: var(--muted); }
  .login-card .switch a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .login-card .switch a:hover { text-decoration: underline; }

  /* ---------- APP SHELL ---------- */
  .app { display: none; grid-template-columns: 250px 1fr; min-height: 100vh; }
  .app.active { display: grid; }
  @media (max-width: 900px) { .app.active { grid-template-columns: 1fr; } }

  .sidebar { background: var(--panel); border-right: 1px solid var(--border); padding: 1.1rem 0; display: flex; flex-direction: column; }
  .sidebar h1 { font-size: 0.95rem; padding: 0 1.1rem 0.9rem; margin: 0; border-bottom: 1px solid var(--border); letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.5rem; font-weight: 700; }
  .sidebar h1 span { background: var(--accent); color: #0d1117; font-size: 0.62rem; padding: 0.15rem 0.5rem; border-radius: 100px; font-weight: 700; letter-spacing: 0.03em; }

  .user-box {
    padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    font-size: 0.8rem;
  }
  .user-box .uname { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-box .role-badge { font-size: 0.6rem; padding: 0.1rem 0.45rem; border-radius: 100px; background: var(--border); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
  .user-box .role-badge.admin { background: #5b21b6; color: #ddd6fe; }
  .user-box button.logout {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 0.25rem 0.55rem; border-radius: 0.4rem; font-size: 0.72rem; cursor: pointer; font-family: inherit;
  }
  .user-box button.logout:hover { border-color: var(--red); color: var(--red); }

  .prob-list { list-style: none; padding: 0; margin: 0.5rem 0 0 0; }
  .prob-list li { padding: 0.65rem 1.1rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--muted); border-left: 3px solid transparent; transition: 0.1s; gap: 0.5rem; }
  .prob-list li:hover { background: var(--panel2); color: var(--text); }
  .prob-list li.active { background: var(--panel2); color: var(--text); border-left-color: var(--accent); }
  .prob-list li .badge { font-size: 0.62rem; padding: 0.12rem 0.5rem; border-radius: 100px; background: var(--border); color: var(--muted); white-space: nowrap; }
  .prob-list li .badge.ok { background: #1f6f37; color: #b8f0c4; }
  .prob-list li .badge.warn { background: #3d2e0a; color: #f0d68c; }
  .prob-list li .badge.err { background: #4a1d1d; color: #f5a8a8; }
  .prob-list li .badge.solved { background: #1f6f37; color: #b8f0c4; font-weight: 700; }

  .main { padding: 1.75rem 2.25rem 3rem; overflow-y: auto; max-height: 100vh; }
  .prob-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 0.9rem; margin-bottom: 1rem; }
  .prob-header h2 { margin: 0; font-size: 1.4rem; letter-spacing: -0.02em; }
  .prob-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .tag { font-size: 0.72rem; padding: 0.18rem 0.6rem; border-radius: 100px; background: var(--panel2); color: var(--muted); border: 1px solid var(--border); }
  .tag.warn { background: #3d2e0a; color: #f0d68c; border-color: #5c450f; }
  .tag.ok { background: #1f6f37; color: #b8f0c4; border-color: #2e8b48; }
  .tag.err { background: #4a1d1d; color: #f5a8a8; border-color: #6e2a2a; }
  .tag.solved { background: #1f6f37; color: #b8f0c4; border-color: #2e8b48; font-weight: 700; }

  .tabs { display: flex; gap: 0.2rem; border-bottom: 1px solid var(--border); margin-bottom: 1.1rem; }
  .tab { background: transparent; border: none; color: var(--muted); font-size: 0.88rem; padding: 0.55rem 1rem; cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit; transition: 0.1s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .panel-content { display: none; }
  .panel-content.active { display: block; }

  .statement { line-height: 1.7; font-size: 0.93rem; }
  .statement h3 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 1.4rem 0 0.5rem; font-weight: 700; }
  .statement p { margin: 0.5rem 0; }
  .statement code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.83rem; background: var(--panel2); padding: 0.08rem 0.35rem; border-radius: 0.3rem; color: var(--orange); }
  .statement code sub { color: var(--orange); }
  .statement pre { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.83rem; background: var(--panel2); padding: 0.85rem 1rem; border-radius: 0.6rem; overflow-x: auto; border: 1px solid var(--border); color: #a5d6ff; }
  .statement ul, .statement ol { padding-left: 1.3rem; margin: 0.5rem 0; }
  .statement li { margin: 0.2rem 0; }
  .statement table { border-collapse: collapse; margin: 0.6rem 0; font-size: 0.85rem; }
  .statement th, .statement td { border: 1px solid var(--border); padding: 0.35rem 0.7rem; text-align: left; }
  .statement th { background: var(--panel2); }

  .sample-block { margin: 1rem 0; border: 1px solid var(--border); border-radius: 0.7rem; overflow: hidden; }
  .sample-block .sample-head { background: var(--panel2); padding: 0.5rem 1rem; font-size: 0.78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .sample-block .sample-head .run-sample { background: var(--accent); color: #0d1117; border: none; padding: 0.28rem 0.8rem; border-radius: 100px; font-size: 0.72rem; font-weight: 700; cursor: pointer; font-family: inherit; }
  .sample-block .sample-head .run-sample:hover { background: #79b8ff; }
  .sample-block .sample-body { display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 600px) { .sample-block .sample-body { grid-template-columns: 1fr; } }
  .sample-block .sample-body > div { padding: 0.7rem 1rem; }
  .sample-block .sample-body .in { border-right: 1px solid var(--border); }
  @media (max-width: 600px) { .sample-block .sample-body .in { border-right: none; border-bottom: 1px solid var(--border); } }
  .sample-block .sample-body pre { margin: 0; font-size: 0.8rem; color: #a5d6ff; white-space: pre; font-family: 'JetBrains Mono', monospace; }
  .sample-block .sample-body .out pre { color: #7ee787; }
  .sample-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }

  .editor-toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .editor-toolbar select, .editor-toolbar button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 0.5rem; font-size: 0.82rem; font-family: inherit; cursor: pointer; transition: 0.1s; }
  .editor-toolbar select:hover, .editor-toolbar button:hover { background: var(--panel); border-color: var(--muted); }
  .editor-toolbar button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 700; }
  .editor-toolbar button.primary:hover { background: #79b8ff; }
  .editor-toolbar button:disabled { opacity: 0.5; cursor: wait; }
  .editor-toolbar .spacer { flex: 1; }

  textarea.code { width: 100%; min-height: 260px; padding: 0.9rem 1rem; border: 1px solid var(--border); border-radius: 0.6rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.82rem; background: #0a0e14; color: var(--text); line-height: 1.55; resize: vertical; tab-size: 2; }
  textarea.code:focus { outline: none; border-color: var(--accent); }
  textarea.stdin { width: 100%; min-height: 120px; padding: 0.7rem 0.9rem; border: 1px solid var(--border); border-radius: 0.6rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.8rem; background: #0a0e14; color: var(--text); line-height: 1.55; resize: vertical; }
  textarea.stdin:focus { outline: none; border-color: var(--accent); }
  textarea.json { width: 100%; min-height: 340px; padding: 0.9rem 1rem; border: 1px solid var(--border); border-radius: 0.6rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.8rem; background: #0a0e14; color: #a5d6ff; line-height: 1.5; resize: vertical; tab-size: 2; }
  textarea.json:focus { outline: none; border-color: var(--accent); }
  .json-status { font-size: 0.8rem; margin-top: 0.4rem; }
  .json-status.ok { color: var(--green); }
  .json-status.bad { color: var(--red); }

  .field-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .results { margin-top: 1rem; }
  .result-box { background: #0a0e14; border: 1px solid var(--border); border-radius: 0.6rem; padding: 0.9rem 1rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; min-height: 90px; }
  .result-box .ok { color: var(--green); }
  .result-box .bad { color: var(--red); }
  .result-box .warn { color: var(--yellow); }
  .result-box .muted { color: var(--muted); }

  .verdict-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .verdict { font-weight: 800; padding: 0.15rem 0.6rem; border-radius: 100px; font-size: 0.75rem; letter-spacing: 0.02em; }
  .verdict.AC { background: #1f6f37; color: #b8f0c4; }
  .verdict.WA { background: #6e1d1d; color: #f8a8a8; }
  .verdict.TLE { background: #1e3a8a; color: #93c5fd; }
  .verdict.MLE { background: #4c1d95; color: #c4b5fd; }
  .verdict.RE { background: #6e1d1d; color: #f8a8a8; }
  .verdict.CE { background: #7c2d12; color: #fdba74; }
  .verdict.ERR { background: #78350f; color: #fcd34d; }
  .status-msg { font-size: 0.8rem; color: var(--muted); }

  .note { background: #1c2128; border-left: 3px solid var(--yellow); padding: 0.6rem 0.9rem; border-radius: 0.4rem; font-size: 0.82rem; color: #f0d68c; margin: 0.7rem 0; }
  .note code { background: #0a0e14; padding: 0.05rem 0.3rem; border-radius: 0.25rem; color: var(--orange); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }

  details.help { margin-top: 1rem; font-size: 0.82rem; color: var(--muted); }
  details.help summary { cursor: pointer; padding: 0.4rem 0; }
  details.help summary:hover { color: var(--text); }

  .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem; }
  .btn-row button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.9rem; border-radius: 0.5rem; font-size: 0.8rem; font-family: inherit; cursor: pointer; }
  .btn-row button:hover { background: var(--panel); border-color: var(--muted); }
  .btn-row button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 700; }
  .btn-row button.primary:hover { background: #79b8ff; }

  .mode-toggle { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--panel2); border: 1px solid var(--border); padding: 0.35rem 0.7rem; border-radius: 100px; font-size: 0.78rem; cursor: pointer; user-select: none; }
  .mode-toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: 0.15s; }
  .mode-toggle.on .dot { background: var(--green); box-shadow: 0 0 6px #3fb95088; }
  .mode-toggle:hover { border-color: var(--muted); }

  .progress-bar-wrap { padding: 0.8rem 1.1rem; border-bottom: 1px solid var(--border); }
  .progress-bar { height: 6px; background: var(--border); border-radius: 100px; overflow: hidden; margin-top: 0.3rem; }
  .progress-bar > div { height: 100%; background: var(--green); transition: 0.3s; }
  .progress-label { font-size: 0.7rem; color: var(--muted); display: flex; justify-content: space-between; }
</style>
</head>
<body>

<!-- ============================================================
     LOGIN SCREEN
     ============================================================ -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>JHPIC <span>Beta</span></h1>
    <p class="sub" id="loginSub">Sign in to track your progress</p>
    <div class="err" id="loginErr"></div>

    <div id="signinForm">
      <label for="loginUser">Username</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="your username">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="your password">
      <button id="signinBtn">Sign in</button>
      <div class="switch">
        Don't have an account? <a id="showSignup">Create one</a>
      </div>
    </div>

    <div id="signupForm" style="display:none;">
      <label for="signupUser">Choose a username</label>
      <input type="text" id="signupUser" autocomplete="username" placeholder="username (3-20 chars)">
      <label for="signupPass">Choose a password</label>
      <input type="password" id="signupPass" autocomplete="new-password" placeholder="min 4 characters">
      <label for="signupPass2">Confirm password</label>
      <input type="password" id="signupPass2" autocomplete="new-password" placeholder="repeat password">
      <button id="signupBtn">Create account</button>
      <div class="switch">
        Already have an account? <a id="showSignin">Sign in</a>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     APP SHELL
     ============================================================ -->
<div class="app" id="app">
  <aside class="sidebar">
    <h1>JHPIC <span>Beta</span></h1>
    <div class="user-box">
      <div style="min-width:0; flex:1; display:flex; flex-direction:column; gap:0.15rem;">
        <span class="uname" id="userName">—</span>
        <span class="role-badge" id="userRole">student</span>
      </div>
      <button class="logout" id="logoutBtn">logout</button>
    </div>
    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-label"><span>Progress</span><span id="progressText">0 / 5</span></div>
      <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
    </div>
    <ul class="prob-list" id="probList"></ul>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

<script>
/* ============================================================
 * ACCOUNTS + AUTH
 * ------------------------------------------------------------
 * NOTE: This is a client-side demo. "Passwords" are hashed with a
 * tiny non-cryptographic hash and stored in localStorage. It's fine
 * for classroom/contest use on a single device but NOT real security.
 * The admin account is hardcoded below.
 * ============================================================ */
const ADMIN_USERNAME = 'admin';
const ADMIN_PASSWORD = 'jhpic-admin-2024';   // <-- change this!

// Tiny non-crypto hash, just so passwords aren't plaintext in LS
function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return 'h' + (h >>> 0).toString(36) + '_' + s.length;
}

const LS_USERS   = 'jhpic_users_v1';
const LS_SESSION = 'jhpic_session_v1';

function loadUsers() {
  try { return JSON.parse(localStorage.getItem(LS_USERS) || '{}'); }
  catch (e) { return {}; }
}
function saveUsers(u) { localStorage.setItem(LS_USERS, JSON.stringify(u)); }

function getUser(name) {
  const users = loadUsers();
  return users[name.toLowerCase()] || null;
}
function createUser(name, pass) {
  const users = loadUsers();
  const key = name.toLowerCase();
  if (users[key]) throw new Error('Username already taken');
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(name)) throw new Error('Username must be 3-20 chars (letters, digits, _)');
  if (pass.length < 4) throw new Error('Password must be at least 4 characters');
  users[key] = {
    username: name,
    passwordHash: hashStr(pass),
    progress: {},      // { q1: 'solved' | 'attempted' | null, ... }
    savedCode: {},     // { q1: { lang, code } }
    createdAt: Date.now(),
  };
  saveUsers(users);
  return users[key];
}
function verifyUser(name, pass) {
  // Hardcoded admin
  if (name.toLowerCase() === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
    return { username: ADMIN_USERNAME, isAdmin: true, progress: {}, savedCode: {} };
  }
  const u = getUser(name);
  if (!u) throw new Error('No such user');
  if (u.passwordHash !== hashStr(pass)) throw new Error('Incorrect password');
  return { ...u, isAdmin: false };
}
function updateUser(name, mutate) {
  const users = loadUsers();
  const key = name.toLowerCase();
  if (!users[key]) return;
  mutate(users[key]);
  saveUsers(users);
}

let currentUser = null;   // { username, isAdmin, progress, savedCode }

function setSession(name, pass) {
  try { localStorage.setItem(LS_SESSION, JSON.stringify({ name, pass })); } catch (e) {}
}
function clearSession() { localStorage.removeItem(LS_SESSION); }
function restoreSession() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_SESSION) || 'null');
    if (!s) return null;
    return verifyUser(s.name, s.pass);
  } catch (e) { return null; }
}

/* ============================================================
 * CHECKERS
 * ============================================================ */
function stripTrailing(s) {
  return String(s).replace(/\r\n/g, '\n').split('\n').map(l => l.replace(/[ \t]+$/,'')).join('\n').replace(/\n+$/,'');
}
function checkOutput(userOut, correctOut) {
  const u = stripTrailing(userOut);
  const e = stripTrailing(correctOut);
  if (u === e) return { verdict: 'AC', detail: 'Accepted' };
  return { verdict: 'WA', detail: 'Wrong answer' };
}
const CHECKERS = {
  q1: (u, e) => checkOutput(u, e),
  q2: (u, e) => {
    const ut = stripTrailing(u).trim(), et = stripTrailing(e).trim();
    const mu = ut.match(/^(\d+(?:\.\d+)?)\s+(-?\d+)$/);
    const me = et.match(/^(\d+(?:\.\d+)?)\s+(-?\d+)$/);
    if (!mu || !me) return { verdict: 'WA', detail: 'Wrong answer' };
    if (Math.abs(parseFloat(mu[1]) - parseFloat(me[1])) > 0.01) return { verdict: 'WA', detail: 'Wrong answer' };
    if (parseInt(mu[2],10) !== parseInt(me[2],10)) return { verdict: 'WA', detail: 'Wrong answer' };
    return { verdict: 'AC', detail: 'Accepted' };
  },
  q3: (u, e) => checkOutput(u, e),
  q4: (u, e) => checkOutput(u, e),
  q5: () => ({ verdict: 'ERR', detail: 'No automated checker — manual comparison only.' }),
};

/* ============================================================
 * DEFAULT TEST CASES (admin-editable)
 * ============================================================ */
const DEFAULT_TESTCASES = {
  q1: [
    { input: "25 123\nSCI PED MAS ENG MAA\nSCI PED MAS ENG MAA\nSCI PED MAS ENG MAA\nSCI PED MAS ENG MAA\nSCI PED MAS ENG MAA", correct: "YES", note: "Statement sample." }
  ],
  q2: [
    { input: "4 5 2 24\n1 2 3 1\n2 1 1 1 1\n3 2\n1", correct: "88.89 1", note: "Statement sample." }
  ],
  q3: [
    { input: "10\nP 10\nR 14 64\nP 8\nR 62 100\nR 32 74\nP 9\nP 5\nF 23\nF 43\nR 30 54", correct: "5\n62\n43\n14 64\n3\n43 14-64 62-100", note: "Statement sample." }

function runJavaScript(code, stdin, limits) {

      const __STDIN__ = ${JSON.stringify(stdin)};

      const fakeFs = { readFileSync: fd => fd === 0 ? __STDIN__ : '', writeFileSync: () => {} };

      const fakeConsole = {

        error: (...a) => __LOGS__.push(a.map(stringifyArg).join(' ')),
        warn:  (...a) => __LOGS__.push(a.map(stringifyArg).join(' ')),

        const wrapped = new Function('require','console','process','module','exports','__dirname','__filename', ${JSON.stringify(code)});

        self.postMessage({ output: __LOGS__.join('\\n'), error: null });
      } catch (err) { self.postMessage({ output: __LOGS__.join('\\n'), error: err.message }); }
    `;
    const blob = new Blob([workerSource], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    const worker = new Worker(url);
    let settled = false;
    const t = setTimeout(() => { if (settled) return; settled = true; worker.terminate(); URL.revokeObjectURL(url); resolve({ output: null, error: 'Time Limit Exceeded', verdict: 'TLE' }); }, wallMs);
    worker.onmessage = e => { if (settled) return; settled = true; clearTimeout(t); worker.terminate(); URL.revokeObjectURL(url); resolve({ output: e.data.output, error: e.data.error, verdict: e.data.error ? 'RE' : 'AC' }); };
    worker.onerror = err => { if (settled) return; settled = true; clearTimeout(t); worker.terminate(); URL.revokeObjectURL(url); resolve({ output: null, error: err.message || 'Worker error', verdict: 'RE' }); };

import sys, io, builtins

__orig_stdout__ = sys.stdout
__orig_stderr__ = sys.stderr

def __fake_input__(prompt=''):

builtins.input = __fake_input__
\`);
          let err = null;

\`);
          self.postMessage({ output: stdout + (stderr ? '\\n' + stderr : ''), error: err });
        } catch (e) { self.postMessage({ output: null, error: 'Pyodide error: ' + (e && e.message ? e.message : String(e)) }); }
      })();
    `;
    const blob = new Blob([workerSource], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    const worker = new Worker(url);
    let settled = false;
    const t = setTimeout(() => { if (settled) return; settled = true; worker.terminate(); URL.revokeObjectURL(url); resolve({ output: null, error: 'Time Limit Exceeded', verdict: 'TLE' }); }, wallMs);
    worker.onmessage = e => { if (settled) return; settled = true; clearTimeout(t); worker.terminate(); URL.revokeObjectURL(url); resolve({ output: e.data.output, error: e.data.error, verdict: e.data.error ? 'RE' : 'AC' }); };
    worker.onerror = err => { if (settled) return; settled = true; clearTimeout(t); worker.terminate(); URL.revokeObjectURL(url); resolve({ output: null, error: err.message || 'Worker error', verdict: 'RE' }); };
  });
}
async function runViaJudge0(judge0Id, code, stdin, limits) {
  const url = 'https://ce.judge0.com/submissions?wait=true&base64_encoded=false';
  const body = { language_id: judge0Id, source_code: code, stdin, cpu_time_limit: limits.cpuTime, wall_time_limit: limits.wallTime, memory_limit: limits.memoryKb };

    const data = await res.json();
    const statusId = data.status ? data.status.id : 0;
    const stdout = data.stdout || ''; const stderr = data.stderr || ''; const compileOut = data.compile_output || '';
    if (statusId === 6) return { output: null, error: 'Compilation error:\n' + compileOut, verdict: 'CE' };

    if (statusId >= 7) return { output: stdout, error: stderr || data.message || 'Runtime error', verdict: 'RE' };
    return { output: stdout, error: null, verdict: 'AC' };
  } catch (err) { return { output: null, error: 'Network error: ' + err.message, verdict: 'ERR' }; }

function friendlyParseJson(text) {
  let out = '', inString = false, escaped = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (escaped) { out += ch; escaped = false; continue; }
    if (ch === '\\') { out += ch; escaped = true; continue; }
    if (ch === '"') { inString = !inString; out += ch; continue; }
    if (inString && (ch === '\n' || ch === '\r')) {
      if (ch === '\r' && text[i+1] === '\n') i++;
      out += '\\n'; continue;
    }
    if (inString && ch === '\t') { out += '\\t'; continue; }
    out += ch;
  }
  return JSON.parse(out);
}
function validateTestCases(arr) {
  if (!Array.isArray(arr)) throw new Error('Top level must be an array');
  for (let i = 0; i < arr.length; i++) {
    const c = arr[i];
    if (typeof c !== 'object' || c === null) throw new Error(`Case ${i}: not an object`);
    if (typeof c.input !== 'string') throw new Error(`Case ${i}: "input" must be a string`);
    if (typeof c.correct !== 'string') throw new Error(`Case ${i}: "correct" must be a string`);
  }
  return arr;
}

    </div>
    <div class="panel-content active" data-panel="statement">
      <div class="statement">${p.statement}</div>
      <details class="help">
        <summary>Checker status: ${escapeHtml(p.statusNote)}</summary>
        <p>${escapeHtml(p.statusNote)}</p>
      </details>
    </div>
    <div class="panel-content" data-panel="samples">
      ${tcs.length === 0
        ? `<div class="note">No test cases defined.</div>`
        : tcs.map((sm, i) => `
          <div class="sample-block" data-sample-index="${i}">
            <div class="sample-head">
              <span>Case ${i + 1}${sm.note ? ' · ' + escapeHtml(sm.note) : ''}</span>
              <button class="run-sample">▶ Run with your solver</button>
            </div>
            <div class="sample-body">
              <div class="in">
                <div class="sample-label">Input</div>
                <pre>${escapeHtml(sm.input)}</pre>
              </div>
              <div class="out">
                <div class="sample-label">Correct output</div>
                <pre>${escapeHtml(sm.correct)}</pre>
              </div>
            </div>
          </div>
        `).join('')
      }
    </div>
    ${isAdmin ? `
    <div class="panel-content" data-panel="json">
      <div class="note">
        <strong>Admin only.</strong> Each case needs <code>input</code> and <code>correct</code>.
        ${friendlyMode ? 'Friendly mode is <strong>on</strong>.' : 'Strict mode — use <code>\\n</code> for newlines.'}
      </div>
      <div class="field-label" style="margin-top:0.6rem; display:flex; justify-content:space-between; align-items:center;">
        <span>Test cases JSON</span>
        <span class="mode-toggle ${friendlyMode ? 'on' : ''}" id="modeToggle">
          <span class="dot"></span><span>Friendly mode</span>
        </span>
      </div>
      <textarea class="json" id="jsonEditor" spellcheck="false">${escapeHtml(tcsJson)}</textarea>
      <div class="json-status" id="jsonStatus"></div>
      <div class="btn-row">
        <button class="primary" id="saveJsonBtn">💾 Save test cases</button>
        <button id="resetJsonBtn">↺ Reset to defaults</button>
      </div>
    </div>
    ` : ''}
    <div class="panel-content" data-panel="solver">
      <div class="editor-toolbar">
        <select id="langSelect">
          ${Object.entries(LANGUAGES).map(([k, v]) => `<option value="${k}" ${k === s.lang ? 'selected' : ''}>${v.label}</option>`).join('')}
        </select>
        <button class="primary" id="runBtn">▶ Run</button>
        <button id="runAllBtn">▶ Run all cases</button>
        <button id="resetCodeBtn">↺ Reset</button>
        <button id="clearOutBtn">✕ Clear</button>
        <span class="spacer"></span>
      </div>
      <div class="field-label">Code</div>
      <textarea class="code" id="codeEditor" spellcheck="false">${escapeHtml(s.code)}</textarea>
      <div class="field-label" style="margin-top:0.9rem;">Stdin</div>
      <textarea class="stdin" id="stdinBox" spellcheck="false" placeholder="Paste input here, or click 'Run with your solver' on a test case.">${escapeHtml(s.stdin)}</textarea>
      <div class="results">
        <div class="field-label">Result</div>
        <div class="result-box" id="resultBox">
          <span class="muted">Run your code to see output.</span>
        </div>
      </div>
    </div>
  `;

  main.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const name = tab.dataset.tab;
      main.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      main.querySelectorAll('.panel-content').forEach(pc => pc.classList.toggle('active', pc.dataset.panel === name));
    });
  });

  const langSelect = document.getElementById('langSelect');
  langSelect.addEventListener('change', () => {
    state[p.id].lang = langSelect.value;
    state[p.id].code = LANGUAGES[langSelect.value].example;
    document.getElementById('codeEditor').value = state[p.id].code;
    saveUserState();
  });

  document.getElementById('codeEditor').addEventListener('input', e => {
    state[p.id].code = e.target.value;
    saveUserState();
  });
  document.getElementById('stdinBox').addEventListener('input', e => { state[p.id].stdin = e.target.value; });

  document.getElementById('resetCodeBtn').addEventListener('click', () => {
    state[p.id].code = LANGUAGES[state[p.id].lang].example;
    document.getElementById('codeEditor').value = state[p.id].code;
    saveUserState();
  });

  document.getElementById('clearOutBtn').addEventListener('click', () => {
    document.getElementById('resultBox').innerHTML = '<span class="muted">Run your code to see output.</span>';
  });

  document.getElementById('runBtn').addEventListener('click', () => {
    const match = tcs.find(t => stripTrailing(t.input) === stripTrailing(s.stdin));
    runAndShow(p, state[p.id], match || null);
  });

  document.getElementById('runAllBtn').addEventListener('click', async () => {
    if (tcs.length === 0) { document.getElementById('resultBox').innerHTML = '<span class="muted">No test cases to run.</span>'; return; }
    await runAllAndShow(p, state[p.id], tcs);
  });

  // Admin-only handlers
  if (isAdmin) {
    document.getElementById('modeToggle').addEventListener('click', () => {
      friendlyMode = !friendlyMode;
      renderProblem();
      document.querySelector('.tab[data-tab="json"]').click();
    });

    const jsonEditor = document.getElementById('jsonEditor');
    const jsonStatus = document.getElementById('jsonStatus');
    const tryParse = () => {
      try {
        const parsed = friendlyMode ? friendlyParseJson(jsonEditor.value) : JSON.parse(jsonEditor.value);
        validateTestCases(parsed);
        jsonStatus.className = 'json-status ok';
        jsonStatus.textContent = `✓ Valid — ${parsed.length} test case${parsed.length === 1 ? '' : 's'}`;
        return parsed;
      } catch (e) {
        jsonStatus.className = 'json-status bad';
        jsonStatus.textContent = `✗ ${e.message}`;
        return null;
      }
    };
    jsonEditor.addEventListener('input', tryParse);

    document.getElementById('saveJsonBtn').addEventListener('click', () => {
      const parsed = tryParse();
      if (!parsed) return;
      TESTCASES[p.id] = parsed;
      saveTestcases(TESTCASES);
      renderProblem();
      document.querySelector('.tab[data-tab="json"]').click();
      const st = document.getElementById('jsonStatus');
      st.className = 'json-status ok';
      st.textContent = `✓ Saved ${parsed.length} test case${parsed.length === 1 ? '' : 's'}`;
    });

    document.getElementById('resetJsonBtn').addEventListener('click', () => {
      TESTCASES[p.id] = JSON.parse(JSON.stringify(DEFAULT_TESTCASES[p.id] || []));
      saveTestcases(TESTCASES);
      renderProblem();
      document.querySelector('.tab[data-tab="json"]').click();
    });
  }

  main.querySelectorAll('.run-sample').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.closest('.sample-block').dataset.sampleIndex);
      const sample = tcs[idx];
      if (!sample) return;
      state[p.id].stdin = sample.input;
      document.getElementById('stdinBox').value = sample.input;
      main.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'solver'));
      main.querySelectorAll('.panel-content').forEach(pc => pc.classList.toggle('active', pc.dataset.panel === 'solver'));
      runAndShow(p, state[p.id], sample);
    });
  });
}

async function runAndShow(p, s, sample = null) {
  const box = document.getElementById('resultBox');
  const runBtn = document.getElementById('runBtn');
  const runAllBtn = document.getElementById('runAllBtn');
  const langKey = s.lang; const code = s.code; const stdin = s.stdin;

  runBtn.disabled = true; runBtn.textContent = '⏳ Running…';
  runAllBtn.disabled = true;
  box.innerHTML = `<span class="muted">Running in ${LANGUAGES[langKey].label}…</span>`;

  let res;
  try { res = await runCode(langKey, code, stdin); }
  catch (err) { res = { output: null, error: err.message || String(err), verdict: 'ERR' }; }

  runBtn.disabled = false; runBtn.textContent = '▶ Run';
  runAllBtn.disabled = false;

  const execVerdict = res.verdict || (res.error ? 'RE' : 'AC');
  let html = '';

  if (sample) {
    const cmp = (execVerdict === 'AC')
      ? CHECKERS[p.id](res.output || '', sample.correct)
      : { verdict: execVerdict, detail: execVerdict === 'TLE' ? 'Time Limit Exceeded' :
                                          execVerdict === 'CE' ? 'Compilation Error' :
                                          execVerdict === 'RE' ? 'Runtime Error' : 'Error' };
    html += `<div class="verdict-row">`;
    html += `<span class="field-label" style="margin:0;">verdict</span>`;
    html += `<span class="verdict ${cmp.verdict}">${cmp.verdict}</span>`;
    html += `<span class="status-msg ${cmp.verdict === 'AC' ? 'ok' : 'bad'}">${escapeHtml(cmp.detail)}</span>`;
    html += `</div>`;
    html += `<hr style="border:none;border-top:1px solid var(--border);margin:0.5rem 0;">`;
    html += `<div class="field-label">Your output</div>`;
    html += `<pre style="margin:0;white-space:pre-wrap;word-break:break-word;">${escapeHtml(res.output || '(no output)')}</pre>`;
    if (res.error) html += `<div class="status-msg bad" style="margin-top:0.5rem;">stderr: ${escapeHtml(res.error)}</div>`;

    // Update progress
    markProgress(p.id, cmp.verdict);
  } else {
    html += `<div class="verdict-row"><span class="verdict ${execVerdict}">${execVerdict}</span>`;
    if (res.error) html += `<span class="status-msg bad">${escapeHtml(res.error)}</span>`;
    html += `</div>`;
    if (res.output !== null && res.output !== undefined) {
      html += `<pre style="margin:0;white-space:pre-wrap;word-break:break-word;">${escapeHtml(res.output || '(no output)')}</pre>`;
    }
  }

  box.innerHTML = html;
  s.lastOutput = res.output || ''; s.lastVerdict = execVerdict;
}

async function runAllAndShow(p, s, tcs) {
  const box = document.getElementById('resultBox');
  const runBtn = document.getElementById('runBtn');
  const runAllBtn = document.getElementById('runAllBtn');
  const langKey = s.lang; const code = s.code;

  runBtn.disabled = true;
  runAllBtn.disabled = true; runAllBtn.textContent = '⏳ Running all…';
  box.innerHTML = `<span class="muted">Running ${tcs.length} test case${tcs.length === 1 ? '' : 's'} in ${LANGUAGES[langKey].label}…</span>`;

  const results = [];
  for (let i = 0; i < tcs.length; i++) {
    const tc = tcs[i];
    let res;
    try { res = await runCode(langKey, code, tc.input); }
    catch (err) { res = { output: null, error: err.message || String(err), verdict: 'ERR' }; }
    const execVerdict = res.verdict || (res.error ? 'RE' : 'AC');
    let cmp;
    if (execVerdict === 'AC') cmp = CHECKERS[p.id](res.output || '', tc.correct);
    else cmp = { verdict: execVerdict, detail: execVerdict === 'TLE' ? 'Time Limit Exceeded' :
                                            execVerdict === 'CE' ? 'Compilation Error' :
                                            execVerdict === 'RE' ? 'Runtime Error' : 'Error' };
    results.push({ index: i + 1, note: tc.note, verdict: cmp.verdict, detail: cmp.detail });
  }

  runBtn.disabled = false;
  runAllBtn.disabled = false; runAllBtn.textContent = '▶ Run all cases';

  const passed = results.filter(r => r.verdict === 'AC').length;
  const total = results.length;

  let html = `<div class="verdict-row">`;
  html += `<span class="field-label" style="margin:0;">summary</span>`;
  html += `<span class="verdict ${passed === total ? 'AC' : 'WA'}">${passed} / ${total} passed</span>`;
  html += `</div>`;
  html += `<hr style="border:none;border-top:1px solid var(--border);margin:0.5rem 0;">`;
  results.forEach(r => {
    html += `<div style="display:flex; gap:0.6rem; align-items:center; padding:0.3rem 0; border-bottom:1px solid var(--border);">`;
    html += `<span style="color:var(--muted); min-width:2rem;">#${r.index}</span>`;
    html += `<span class="verdict ${r.verdict}" style="min-width:3rem; text-align:center;">${r.verdict}</span>`;
    html += `<span style="color:var(--muted); font-size:0.78rem; flex:1;">${escapeHtml(r.note || r.detail || '')}</span>`;
    html += `</div>`;
  });
  box.innerHTML = html;

  // Update progress: if all cases passed, mark as solved
  if (passed === total && total > 0) markProgress(p.id, 'AC');
  else if (total > 0) markProgress(p.id, 'attempted');
}

/* ============================================================
 * LOGIN UI
 * ============================================================ */
function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginUser').focus();
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = currentUser.username;
  const roleEl = document.getElementById('userRole');
  roleEl.textContent = currentUser.isAdmin ? 'admin' : 'student';
  roleEl.className = 'role-badge' + (currentUser.isAdmin ? ' admin' : '');
  renderSidebar();
  renderProblem();
}

function bindLoginHandlers() {
  const err = document.getElementById('loginErr');

  document.getElementById('signinBtn').addEventListener('click', () => {
    err.textContent = '';
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    if (!u || !p) { err.textContent = 'Enter username and password'; return; }
    try {
      const user = verifyUser(u, p);
      currentUser = user;
      setSession(u, p);
      loadUserState(user);
      showApp();
    } catch (e) { err.textContent = e.message; }
  });

  document.getElementById('signupBtn').addEventListener('click', () => {
    err.textContent = '';
    const u = document.getElementById('signupUser').value.trim();
    const p = document.getElementById('signupPass').value;
    const p2 = document.getElementById('signupPass2').value;
    if (!u || !p || !p2) { err.textContent = 'Fill in all fields'; return; }
    if (p !== p2) { err.textContent = 'Passwords do not match'; return; }
    try {
      const user = createUser(u, p);
      currentUser = { ...user, isAdmin: false };
      setSession(u, p);
      loadUserState(currentUser);
      showApp();
    } catch (e) { err.textContent = e.message; }
  });

  document.getElementById('showSignup').addEventListener('click', () => {
    document.getElementById('signinForm').style.display = 'none';
    document.getElementById('signupForm').style.display = 'block';
    document.getElementById('loginSub').textContent = 'Create a new account';
    err.textContent = '';
  });
  document.getElementById('showSignin').addEventListener('click', () => {
    document.getElementById('signinForm').style.display = 'block';
    document.getElementById('signupForm').style.display = 'none';
    document.getElementById('loginSub').textContent = 'Sign in to track your progress';
    err.textContent = '';
  });

  // Enter to submit
  ['loginUser','loginPass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('signinBtn').click();
    });
  });
  ['signupUser','signupPass','signupPass2'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('signupBtn').click();
    });
  });
}

function bindLogout() {
  document.getElementById('logoutBtn').addEventListener('click', () => {
    currentUser = null;
    clearSession();
    // reset state to defaults
    PROBLEMS.forEach(p => {
      state[p.id].lang = 'javascript';
      state[p.id].code = LANGUAGES.javascript.example;
    });
    showLogin();
  });
}

/* ============================================================
 * INIT
 * ============================================================ */
bindLoginHandlers();
bindLogout();

const restored = restoreSession();
if (restored) {
  currentUser = restored;
  loadUserState(restored);
  showApp();
} else {
  showLogin();
}
</script>
</body>
